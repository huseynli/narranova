name: narranova

services:
  app:
    image: ghcr.io/huseynli/narranova:latest
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NARRANOVA_DATA_DIR: /data
      TZ: UTC
    volumes:
      - narranova-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  narranova-data:
    name: narranova-data
