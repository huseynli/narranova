name: narranova

services:
  app:
    image: narranova:local
    build:
      context: .
      args:
        NARRANOVA_VERSION: dev
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NARRANOVA_DATA_DIR: /data
      TZ: UTC
    volumes:
      - narranova-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  narranova-data:
    name: narranova-data
