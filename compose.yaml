name: narranova

services:
  app:
    image: ${NARRANOVA_IMAGE:-narranova:local}
    build:
      context: .
      args:
        NARRANOVA_VERSION: ${NARRANOVA_VERSION:-dev}
    init: true
    restart: unless-stopped
    ports:
      - "${NARRANOVA_PORT:-8787}:8787"
    environment:
      NARRANOVA_DATA_DIR: /data
      TZ: ${TZ:-UTC}
    volumes:
      - narranova-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  narranova-data:
    name: narranova-data
