[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "narranova"
version = "0.1.0.dev0"
description = "Self-hostable EPUB-to-audiobook production pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Narranova contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
narranova = "narranova.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/narranova"]

[tool.hatch.build.targets.wheel.force-include]
"src/narranova/persistence/migrations" = "narranova/persistence/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
